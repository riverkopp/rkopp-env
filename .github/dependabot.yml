# Keeps the SHA-pinned actions in .github/workflows up to date. Dependabot
# bumps the SHA and the "# vX.Y.Z" comment next to it together.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before taking a new release, so a compromised or broken
    # version is usually caught and pulled before it lands here.
    cooldown:
      default-days: 7
