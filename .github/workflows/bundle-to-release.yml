name: Bundle Lists and Release

on:
  push:
    branches:
      - main
    paths:
      - 'lists/Brewfile'
      - 'lists/vsc_install_list.sh'
  workflow_dispatch:

jobs:
  release:
    name: Release Bundle
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RESUME_PAT }}
          persist-credentials: false

      - name: Pull latest changes
        run: git pull --rebase

      - name: Generate release tag
        id: tag
        run: |
          TAG="$(TZ="America/Chicago" date +"%y.%m.%d.%H%M")-bundle"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release and upload files
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --latest \
            lists/Brewfile \
            lists/vsc_install_list.sh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.RESUME_PAT }}
